<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATTY</title>
    <!-- Tailwind CSS の読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <style>
        /* チャットのスクロールバーなどを可愛く */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-navy-50 text-gray-800 dark:bg-slate-900 dark:text-gray-100 transition-colors duration-300 font-sans">

<div id="app" class="max-w-4xl mx-auto bg-white dark:bg-slate-800 min-h-screen shadow-2xl flex flex-col relative overflow-hidden transition-colors duration-300">

    <!-- パスコード入力画面 (一番上に被さる) -->
    <div id="lock-screen" class="hidden absolute inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col items-center justify-center p-8 transition-colors duration-300">
        <svg class="w-16 h-16 text-navy-600 dark:text-navy-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <h2 class="text-2xl font-bold text-navy-800 dark:text-white mb-6">パスコードを入力</h2>
        <input type="password" id="verify-passcode" placeholder="4桁の数字" maxlength="4" class="w-48 text-center text-2xl tracking-widest p-4 rounded-2xl border-2 border-gray-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:border-navy-500 mb-4">
        <p id="lock-error" class="text-red-500 text-sm hidden font-bold">パスコードが違います</p>
    </div>
    
    <!-- お知らせバー -->
    <div id="announcement-bar" class="hidden bg-yellow-400 text-yellow-900 font-bold p-3 text-center text-sm shadow-md z-20 relative"></div>

    <!-- ログイン・登録画面 -->
    <div id="auth-screen" class="p-8 flex flex-col justify-center flex-1">
        <div class="text-center mb-8">
            <svg class="w-16 h-16 mx-auto text-navy-600 dark:text-navy-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <h2 class="text-2xl font-extrabold text-navy-800 dark:text-white">Navy Chat</h2>
        </div>
        <div class="space-y-4 max-w-sm mx-auto w-full">
            <input type="email" id="email" placeholder="メールアドレス" class="w-full p-4 bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:ring-2 focus:ring-navy-500 transition">
            <input type="password" id="password" placeholder="パスワード（6文字以上）" class="w-full p-4 bg-gray-50 dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-2xl focus:outline-none focus:ring-2 focus:ring-navy-500 transition">
            <button id="login-btn" class="w-full py-4 bg-navy-600 hover:bg-navy-700 text-white font-bold rounded-2xl shadow-lg transition transform hover:-translate-y-1">ログイン</button>
            <button id="signup-btn" class="w-full py-4 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-2xl shadow-lg transition transform hover:-translate-y-1">新規登録</button>
        </div>
    </div>

    <!-- メイン画面 -->
    <div id="main-screen" class="hidden flex-1 flex flex-col h-screen">
        
        <!-- ナビゲーションバー (上に固定) -->
        <header class="bg-navy-700 text-white rounded-b-3xl shadow-lg pt-4 pb-2 px-2 z-10">
            <div class="text-center mb-3 text-sm font-medium tracking-wider opacity-80" id="user-display-name"></div>
            <nav class="flex justify-around items-center">
                <button onclick="switchTab('friends')" class="nav-btn flex flex-col items-center p-2 rounded-xl hover:bg-navy-600 transition w-1/4">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="text-xs">フレンド</span>
                </button>
                <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center p-2 rounded-xl hover:bg-navy-600 transition w-1/4">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span class="text-xs">プロフ</span>
                </button>
                <button onclick="switchTab('settings')" class="nav-btn flex flex-col items-center p-2 rounded-xl hover:bg-navy-600 transition w-1/4">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="text-xs">設定</span>
                </button>
                <button id="admin-nav-btn" onclick="switchTab('admin')" class="hidden nav-btn flex flex-col items-center p-2 rounded-xl bg-red-600 hover:bg-red-700 transition w-1/4">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <span class="text-xs">管理者</span>
                </button>
            </nav>
        </header>

        <!-- コンテンツエリア -->
        <div class="p-4 flex-1 overflow-y-auto">
            
            <!-- フレンド＆チャットタブ -->
            <div id="tab-friends" class="space-y-6">
                <!-- 検索エリア -->
                <div class="bg-blue-50 dark:bg-slate-700 p-4 rounded-2xl shadow-sm border border-blue-100 dark:border-slate-600">
                    <h3 class="text-sm font-bold text-navy-800 dark:text-blue-300 mb-2">フレンド追加</h3>
                    <div class="flex gap-2">
                        <input type="text" id="friend-search-id" placeholder="相手のフレンドIDを入力" class="flex-1 p-3 text-sm rounded-xl border border-gray-300 dark:border-slate-600 dark:bg-slate-800 focus:outline-none focus:border-navy-500">
                        <button id="send-request-btn" class="bg-navy-600 hover:bg-navy-700 text-white px-4 rounded-xl shadow transition whitespace-nowrap">申請</button>
                    </div>
                </div>
                
                <!-- 承認待ち -->
                <div>
                    <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">承認待ち</h3>
                    <div id="friend-requests-list" class="space-y-2"></div>
                </div>

                <!-- フレンドリスト -->
                <div>
                    <h3 class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 uppercase tracking-wider">フレンド</h3>
                    <div id="friends-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- チャット画面 (独立して表示) -->
            <div id="tab-chat" class="hidden flex flex-col h-full absolute inset-0 bg-white dark:bg-slate-800 z-20">
                <header class="bg-navy-700 text-white p-4 flex items-center shadow-md">
                    <button onclick="closeChat()" class="mr-4 p-2 bg-navy-800 rounded-full hover:bg-navy-600 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h3 id="chat-with-name" class="font-bold text-lg truncate"></h3>
                </header>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 dark:bg-slate-900"></div>
                <div class="p-3 bg-white dark:bg-slate-800 border-t dark:border-slate-700 flex gap-2">
                    <input type="text" id="chat-input" placeholder="メッセージ..." class="flex-1 p-3 rounded-full border border-gray-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:border-navy-500">
                    <button id="send-msg-btn" class="bg-navy-600 text-white p-3 rounded-full shadow hover:bg-navy-700 transition">
                        <svg class="w-6 h-6 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>

            <!-- プロフィールタブ -->
            <div id="tab-profile" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-700 p-5 rounded-2xl shadow-sm border dark:border-slate-600">
                    <h3 class="text-sm font-bold text-gray-500 dark:text-gray-300 mb-4">プロフィールの変更</h3>
                    <label class="text-xs font-bold text-gray-500 dark:text-gray-400">表示名</label>
                    <input type="text" id="profile-name" placeholder="新しい表示名" class="w-full p-3 mb-4 border rounded-xl dark:bg-slate-800 dark:border-slate-600 focus:outline-none focus:border-navy-500">
                    <label class="text-xs font-bold text-gray-500 dark:text-gray-400">あなたのフレンドID (半角英数字とアンダーバーのみ)</label>
                    <input type="text" id="profile-friend-id" placeholder="例: my_name_123" class="w-full p-3 mb-4 border rounded-xl dark:bg-slate-800 dark:border-slate-600 focus:outline-none focus:border-navy-500">
                    <button id="update-profile-btn" class="w-full py-3 bg-navy-600 text-white font-bold rounded-xl shadow hover:bg-navy-700 transition">プロフィールを更新</button>
                </div>
            </div>

            <!-- 設定タブ -->
            <div id="tab-settings" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-700 p-5 rounded-2xl shadow-sm border dark:border-slate-600 space-y-6">
                    
                    <!-- ダークモード切替 -->
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-bold dark:text-white">🌙 ダークモード</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">目に優しい暗いテーマ</p>
                        </div>
                        <button id="theme-toggle" class="w-12 h-6 rounded-full bg-gray-300 dark:bg-navy-500 relative transition-colors duration-300">
                            <div id="theme-knob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-1 shadow transition-transform duration-300 transform dark:translate-x-5"></div>
                        </button>
                    </div>

                    <hr class="dark:border-slate-600">

                    <!-- 検索拒否機能 -->
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-bold dark:text-white">🔍 メアド検索を許可</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">オフにすると相手から見つかりません</p>
                        </div>
                        <button id="search-toggle" class="w-12 h-6 rounded-full bg-navy-500 relative transition-colors duration-300">
                            <div id="search-knob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-1 shadow transition-transform duration-300 transform translate-x-5"></div>
                        </button>
                    </div>

                    <hr class="dark:border-slate-600">

                    <!-- パスコード設定 -->
                    <div>
                        <p class="font-bold dark:text-white mb-2">🔒 パスコードロック (この端末のみ)</p>
                        <div class="flex gap-2">
                            <input type="password" id="setup-passcode" placeholder="4桁の数字" maxlength="4" class="flex-1 p-3 rounded-xl border border-gray-300 dark:bg-slate-800 dark:border-slate-600 focus:outline-none focus:border-navy-500">
                            <button id="save-passcode-btn" class="bg-navy-600 hover:bg-navy-700 transition text-white px-4 rounded-xl shadow font-bold">設定</button>
                            <button id="clear-passcode-btn" class="bg-gray-400 hover:bg-gray-500 transition text-white px-4 rounded-xl shadow hidden font-bold">解除</button>
                        </div>
                    </div>

                    <hr class="dark:border-slate-600">
                    
                    <button id="logout-btn" class="w-full py-3 bg-red-100 text-red-600 dark:bg-red-900 dark:text-red-200 font-bold rounded-xl transition hover:bg-red-200">ログアウト</button>
                </div>
            </div>

            <!-- 管理者タブ -->
            <div id="tab-admin" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl shadow-sm border border-red-200 dark:border-red-900">
                    <h3 class="font-bold text-red-600 dark:text-red-400 mb-2">📢 全体アナウンス</h3>
                    <input type="text" id="admin-announcement" placeholder="メッセージ" class="w-full p-3 mb-2 rounded-xl border dark:bg-slate-800 dark:border-slate-600">
                    <button id="send-announcement-btn" class="w-full bg-red-600 text-white py-2 rounded-xl font-bold">配信</button>
                </div>
                <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl shadow-sm border dark:border-slate-600">
                    <h3 class="font-bold mb-2 dark:text-white">ユーザー管理</h3>
                    <div id="admin-users-list" class="space-y-2 text-sm"></div>
                </div>
                <div class="bg-white dark:bg-slate-700 p-4 rounded-2xl shadow-sm border dark:border-slate-600">
                    <h3 class="font-bold mb-2 dark:text-white">通報履歴</h3>
                    <div id="admin-reports-list" class="space-y-2 text-sm"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ダークモードの初期化（localStorageから復元）
    if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

    const firebaseConfig = {
        apiKey: "AIzaSyDf2_te0atlBQNSPu8fS4zt3KMeHAzgW74",
        authDomain: "test-prep-app-7d1fe.firebaseapp.com",
        projectId: "test-prep-app-7d1fe",
        storageBucket: "test-prep-app-7d1fe.firebasestorage.app",
        messagingSenderId: "762482946733",
        appId: "1:762482946733:web:da97907b542ea70b4c4c24"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "mazza.deluxe77@gmail.com";
    let currentUserData = null;
    let currentChatId = null;
    let unsubChat = null;
    // 表示名キャッシュ（プライバシー保護のため、メアドではなく表示名を使う）
    const nameCache = new Map(); 

    const UI = {
        authScreen: document.getElementById('auth-screen'),
        mainScreen: document.getElementById('main-screen'),
        adminNavBtn: document.getElementById('admin-nav-btn'),
        announcementBar: document.getElementById('announcement-bar'),
        loginBtn: document.getElementById('login-btn'),
        signupBtn: document.getElementById('signup-btn'),
        tabs: ['friends', 'profile', 'settings', 'admin']
    };

    window.switchTab = (tabId) => {
        UI.tabs.forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        document.getElementById('tab-chat').classList.add('hidden'); // チャット画面を隠す
    };

    window.closeChat = () => {
        document.getElementById('tab-chat').classList.add('hidden');
        if(unsubChat) unsubChat();
    };

    // キャッシュを利用して名前を取得する便利関数
    async function getUserName(email) {
        if(nameCache.has(email)) return nameCache.get(email);
        try {
            const snap = await getDoc(doc(db, "chatApp_users", email));
            const name = snap.exists() ? snap.data().name : email.split('@')[0];
            nameCache.set(email, name);
            return name;
        } catch { return email.split('@')[0]; }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            UI.loginBtn.innerText = "読込中...";
            try {
                const userRef = doc(db, "chatApp_users", user.email);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    currentUserData = userSnap.data();
                    if (currentUserData.isFrozen) {
                        alert("アカウントが凍結されています。");
                        await signOut(auth); return;
                    }
                    // 古いアカウントにフレンドIDがない場合は自動で付与
                    if (!currentUserData.friendId) {
                        currentUserData.friendId = "user_" + Math.random().toString(36).substring(2, 8);
                    }
                    await updateDoc(userRef, { lastActive: serverTimestamp(), friendId: currentUserData.friendId });
                } else {
                    // 新規登録時にランダムなフレンドIDを生成
                    const randomId = "user_" + Math.random().toString(36).substring(2, 8);
                    currentUserData = { email: user.email, name: user.email.split('@')[0], friendId: randomId, isFrozen: false, searchable: true, lastActive: serverTimestamp() };
                    await setDoc(userRef, currentUserData);
                }

                document.getElementById('user-display-name').innerText = currentUserData.name;
                document.getElementById('profile-name').value = currentUserData.name;
                document.getElementById('profile-friend-id').value = currentUserData.friendId;
                
                // 検索拒否スイッチの初期化
                updateSearchToggleUI(currentUserData.searchable !== false);

                UI.authScreen.classList.add('hidden');
                UI.mainScreen.classList.remove('hidden');
                UI.loginBtn.innerText = "ログイン";

                if (user.email === ADMIN_EMAIL) {
                    UI.adminNavBtn.classList.remove('hidden');
                    UI.adminNavBtn.classList.add('flex');
                    loadAdminData();
                }

                listenToAnnouncements();
                listenToFriendRequests();
                listenToFriends();
            } catch(e) {
                alert("データベースエラー: " + e.message);
                await signOut(auth);
                UI.loginBtn.innerText = "ログイン";
            }
        } else {
            UI.authScreen.classList.remove('hidden');
            UI.mainScreen.classList.add('hidden');
            currentUserData = null;
        }
    });

    UI.loginBtn.addEventListener('click', async () => {
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        } catch (err) { alert("ログイン失敗: " + err.message); }
    });

    UI.signupBtn.addEventListener('click', async () => {
        try {
            await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        } catch (err) { alert("登録失敗: " + err.message); }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // ダークモード切替処理
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 検索拒否トグル処理
    function updateSearchToggleUI(isSearchable) {
        const knob = document.getElementById('search-knob');
        const bg = document.getElementById('search-toggle');
        if (isSearchable) {
            knob.classList.add('translate-x-5'); bg.classList.add('bg-navy-500'); bg.classList.remove('bg-gray-300');
        } else {
            knob.classList.remove('translate-x-5'); bg.classList.remove('bg-navy-500'); bg.classList.add('bg-gray-300');
        }
    }
    
    document.getElementById('search-toggle').addEventListener('click', async () => {
        const currentRef = doc(db, "chatApp_users", auth.currentUser.email);
        const snap = await getDoc(currentRef);
        const newState = !(snap.data().searchable !== false); // 反転
        await updateDoc(currentRef, { searchable: newState });
        updateSearchToggleUI(newState);
        alert(newState ? "検索を許可しました。" : "検索を拒否しました。");
    });

    // --- お知らせ ---
    function listenToAnnouncements() {
        onSnapshot(query(collection(db, "chatApp_announcements"), orderBy("timestamp", "desc")), (snapshot) => {
            if (!snapshot.empty) {
                UI.announcementBar.innerText = "📢 " + snapshot.docs[0].data().text;
                UI.announcementBar.classList.remove('hidden');
            }
        });
    }

    // --- フレンド機能 ---
    document.getElementById('send-request-btn').addEventListener('click', async () => {
        const toId = document.getElementById('friend-search-id').value.trim();
        if (!toId) return;
        if (toId === currentUserData.friendId) return alert("自分には送れません");
        
        try {
            // フレンドIDからユーザーを探す
            const q = query(collection(db, "chatApp_users"), where("friendId", "==", toId));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                return alert("そのフレンドIDのユーザーは見つかりません。");
            }
            
            const targetData = snap.docs[0].data();
            if (targetData.searchable === false) {
                return alert("相手が検索を許可していません。");
            }
            
            await addDoc(collection(db, "chatApp_friendRequests"), { 
                from: auth.currentUser.email, 
                to: targetData.email, // 裏側では確実なメアドを使って管理
                status: 'pending', 
                timestamp: serverTimestamp() 
            });
            alert("フレンド申請を送りました！");
            document.getElementById('friend-search-id').value = "";
        } catch(e) { alert("エラー: " + e.message); }
    });

    function listenToFriendRequests() {
        onSnapshot(query(collection(db, "chatApp_friendRequests"), where("to", "==", auth.currentUser.email), where("status", "==", "pending")), async (snapshot) => {
            const list = document.getElementById('friend-requests-list');
            list.innerHTML = "";
            for (const docSnap of snapshot.docs) {
                const req = docSnap.data();
                const fromName = await getUserName(req.from);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white dark:bg-slate-700 p-3 rounded-xl shadow-sm border dark:border-slate-600";
                div.innerHTML = `<span class="font-bold truncate w-2/3">${fromName}</span> <button class="bg-teal-500 text-white px-3 py-1 rounded-lg text-sm" onclick="acceptFriend('${docSnap.id}')">承認</button>`;
                list.appendChild(div);
            }
        });
    }

    window.acceptFriend = async (requestId) => {
        await updateDoc(doc(db, "chatApp_friendRequests", requestId), { status: 'accepted' });
    };

    function listenToFriends() {
        const q1 = query(collection(db, "chatApp_friendRequests"), where("to", "==", auth.currentUser.email), where("status", "==", "accepted"));
        const q2 = query(collection(db, "chatApp_friendRequests"), where("from", "==", auth.currentUser.email), where("status", "==", "accepted"));
        
        let friendsData = new Map();
        const renderFriends = async () => {
            const list = document.getElementById('friends-list');
            list.innerHTML = "";
            for (const [id, data] of friendsData.entries()) {
                const friendEmail = data.to === auth.currentUser.email ? data.from : data.to;
                const friendName = await getUserName(friendEmail);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white dark:bg-slate-700 p-3 rounded-xl shadow-sm border dark:border-slate-600";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-navy-100 dark:bg-slate-600 rounded-full flex items-center justify-center text-navy-600 dark:text-navy-300 font-bold text-lg">
                            ${friendName.charAt(0).toUpperCase()}
                        </div>
                        <span class="font-bold dark:text-white">${friendName}</span>
                    </div>
                    <button class="bg-navy-100 text-navy-700 dark:bg-slate-600 dark:text-white p-2 rounded-full hover:bg-navy-200 transition" onclick="openChat('${friendEmail}', '${friendName}')">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </button>
                `;
                list.appendChild(div);
            }
        };
        onSnapshot(q1, (snap) => { snap.forEach(d => friendsData.set(d.id, d.data())); renderFriends(); });
        onSnapshot(q2, (snap) => { snap.forEach(d => friendsData.set(d.id, d.data())); renderFriends(); });
    }

    // --- チャット機能 ---
    window.openChat = (friendEmail, friendName) => {
        document.getElementById('tab-chat').classList.remove('hidden');
        document.getElementById('chat-with-name').innerText = friendName;
        currentChatId = [auth.currentUser.email, friendEmail].sort().join("_");

        if (unsubChat) unsubChat();
        unsubChat = onSnapshot(query(collection(db, `chatApp_chats/${currentChatId}/messages`), orderBy("timestamp", "asc")), (snapshot) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = "";
            snapshot.forEach(docSnap => {
                const msg = docSnap.data();
                const isMine = msg.sender === auth.currentUser.email;
                const div = document.createElement('div');
                div.className = `max-w-[75%] md:max-w-md rounded-2xl p-3 relative text-sm shadow-sm ${isMine ? 'bg-navy-500 text-white ml-auto rounded-br-none' : 'bg-white dark:bg-slate-700 dark:text-white border dark:border-slate-600 mr-auto rounded-bl-none'}`;
                div.innerText = msg.text;
                
                if (!isMine) {
                    const rBtn = document.createElement('button');
                    rBtn.className = "absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full shadow hidden";
                    rBtn.innerText = "通報";
                    rBtn.onclick = () => reportMessage(docSnap.id, msg.text, msg.sender);
                    div.onmouseenter = () => rBtn.classList.remove('hidden');
                    div.onmouseleave = () => rBtn.classList.add('hidden');
                    div.appendChild(rBtn);
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    document.getElementById('send-msg-btn').addEventListener('click', async () => {
        const input = document.getElementById('chat-input');
        if (!input.value || !currentChatId) return;
        await addDoc(collection(db, `chatApp_chats/${currentChatId}/messages`), { sender: auth.currentUser.email, text: input.value, timestamp: serverTimestamp() });
        input.value = "";
    });

    window.reportMessage = async (msgId, text, sender) => {
        if (!confirm("不適切な発言として管理者に通報しますか？")) return;
        await addDoc(collection(db, "chatApp_reports"), { msgId, text, sender, reportedBy: auth.currentUser.email, timestamp: serverTimestamp() });
        alert("通報しました。");
    };

    // --- 管理者機能 ---
    document.getElementById('send-announcement-btn').addEventListener('click', async () => {
        const text = document.getElementById('admin-announcement').value;
        if (!text) return;
        await addDoc(collection(db, "chatApp_announcements"), { text, timestamp: serverTimestamp() });
        document.getElementById('admin-announcement').value = "";
        alert("配信完了");
    });

    window.toggleFreeze = async (email, currentStatus) => {
        await updateDoc(doc(db, "chatApp_users", email), { isFrozen: !currentStatus });
    };

    function loadAdminData() {
        onSnapshot(collection(db, "chatApp_users"), (snapshot) => {
            const list = document.getElementById('admin-users-list');
            list.innerHTML = "";
            snapshot.forEach(docSnap => {
                const u = docSnap.data();
                if (u.email === ADMIN_EMAIL) return;
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 dark:bg-slate-800 p-2 rounded border dark:border-slate-600 mb-2";
                div.innerHTML = `<div><p class="font-bold dark:text-white">${u.name}</p><p class="text-xs text-gray-500">${u.email}</p></div>
                    <button class="px-3 py-1 rounded text-white text-xs ${u.isFrozen ? 'bg-gray-500' : 'bg-red-500'}" onclick="toggleFreeze('${u.email}', ${u.isFrozen})">${u.isFrozen ? '凍結解除' : '凍結する'}</button>`;
                list.appendChild(div);
            });
        });

        onSnapshot(collection(db, "chatApp_reports"), (snapshot) => {
            const list = document.getElementById('admin-reports-list');
            list.innerHTML = "";
            snapshot.forEach(docSnap => {
                const r = docSnap.data();
                const div = document.createElement('div');
                div.className = "bg-gray-50 dark:bg-slate-800 p-2 rounded border border-red-200 dark:border-red-900 mb-2";
                div.innerHTML = `<p class="text-xs text-gray-500">通報者: ${r.reportedBy} 👉 対象: ${r.sender}</p><p class="font-bold text-red-600 dark:text-red-400 mt-1">${r.text}</p>`;
                list.appendChild(div);
            });
        });
    }

    // --- パスコード機能 ---
    const localPasscode = localStorage.getItem('app_passcode');
    const lockScreen = document.getElementById('lock-screen');
    const verifyInput = document.getElementById('verify-passcode');
    const setupInput = document.getElementById('setup-passcode');
    const savePassBtn = document.getElementById('save-passcode-btn');
    const clearPassBtn = document.getElementById('clear-passcode-btn');

    // 起動時のロック画面表示
    if (localPasscode) {
        lockScreen.classList.remove('hidden');
        clearPassBtn.classList.remove('hidden');
        savePassBtn.classList.add('hidden');
        setupInput.value = "●●●●";
        setupInput.disabled = true;
    }

    // ロック解除
    verifyInput.addEventListener('input', (e) => {
        if (e.target.value.length === 4) {
            if (e.target.value === localStorage.getItem('app_passcode')) {
                lockScreen.classList.add('hidden');
                e.target.value = "";
                document.getElementById('lock-error').classList.add('hidden');
            } else {
                document.getElementById('lock-error').classList.remove('hidden');
                e.target.value = "";
            }
        }
    });

    // パスコードの設定
    savePassBtn.addEventListener('click', () => {
        const val = setupInput.value;
        if (val.length !== 4 || !/^\d{4}$/.test(val)) return alert("4桁の数字を入力してください");
        localStorage.setItem('app_passcode', val);
        alert("パスコードを設定しました。次回から起動時に要求されます。");
        setupInput.value = "●●●●";
        setupInput.disabled = true;
        savePassBtn.classList.add('hidden');
        clearPassBtn.classList.remove('hidden');
    });

    // パスコードの解除
    clearPassBtn.addEventListener('click', () => {
        if(confirm("パスコードロックを解除しますか？")) {
            localStorage.removeItem('app_passcode');
            setupInput.value = "";
            setupInput.disabled = false;
            savePassBtn.classList.remove('hidden');
            clearPassBtn.classList.add('hidden');
            alert("パスコードを解除しました。");
        }
    });
</script>
</body>
</html>
